name: Build Stray Fix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build test APK
        run: |
          GRADLE_ROOT=$(dirname "$(find . -maxdepth 4 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)")
          echo "Found Gradle root: $GRADLE_ROOT"
          cd "$GRADLE_ROOT"
          if [ -f ./gradlew ]; then
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          $GRADLE_CMD apk \
            -PnxApp=peanuts \
            -PnxAppId=strayfix \
            -PnxLabel="Peanuts StrayFix" \
            -PnxGames=010075101EF84000 \
            -PnxPackEngine=fake

      - name: Collect APKs
        run: |
          mkdir -p built-apks
          find . -name "*.apk" -exec cp -v {} built-apks/ \;
          ls -la built-apks/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peanuts-stray-fix-apk
          path: built-apks/*.apk
